<main class="flex min-h-screen justify-center bg-base p-4 sm:p-8">
  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="w-full max-w-sm self-start rounded-2xl border border-line bg-surface shadow-card p-6"
  >
    <h1 class="mb-5 text-xl font-bold text-ink">{{ itemId ? 'Edit item' : 'Add item' }}</h1>

    <label for="name" class="mb-1 block text-sm text-ink-secondary">Name</label>
    <input
      id="name"
      formControlName="name"
      type="text"
      placeholder="OP01 Monkey D. Luffy Alt Art"
      class="mb-4 w-full rounded-lg border border-line-strong px-3 py-2 text-sm placeholder:text-ink-faint focus:border-brand focus:outline-none"
    />

    <label
      for="selfPulled"
      class="mb-4 flex cursor-pointer items-center gap-2 text-sm text-ink-secondary"
    >
      <input
        id="selfPulled"
        formControlName="selfPulled"
        type="checkbox"
        class="size-4 cursor-pointer rounded border-line-strong accent-brand"
      />
      Self pulled
    </label>

    <div class="mb-4 flex gap-3">
      <div class="flex-1">
        <label for="pricePaid" class="mb-1 block text-sm text-ink-secondary">Price paid</label>
        <input
          id="pricePaid"
          formControlName="pricePaid"
          type="number"
          step="0.01"
          min="0"
          placeholder="45.00"
          class="w-full rounded-lg border border-line-strong px-3 py-2 text-sm placeholder:text-ink-faint focus:border-brand focus:outline-none disabled:bg-card disabled:text-ink-muted"
        />
      </div>
      <div class="w-24">
        <label for="currency" class="mb-1 block text-sm text-ink-secondary">Currency</label>
        <select
          id="currency"
          formControlName="currency"
          class="w-full rounded-lg border border-line-strong px-2 py-2 text-sm focus:border-brand focus:outline-none"
        >
          @for (currency of currencies; track currency) {
            <option [value]="currency">{{ currency }}</option>
          }
        </select>
      </div>
    </div>

    <label for="priceNow" class="mb-1 block text-sm text-ink-secondary">
      Current price <span class="text-xs text-ink-muted">(optional)</span>
    </label>
    <input
      id="priceNow"
      formControlName="priceNow"
      type="number"
      step="0.01"
      min="0"
      placeholder="980.00"
      class="mb-4 w-full rounded-lg border border-line-strong px-3 py-2 text-sm placeholder:text-ink-faint focus:border-brand focus:outline-none"
    />

    <label for="dateAcquired" class="mb-1 block text-sm text-ink-secondary">Date acquired</label>
    <input
      id="dateAcquired"
      formControlName="dateAcquired"
      type="date"
      class="mb-4 w-full rounded-lg border border-line-strong px-3 py-2 text-sm focus:border-brand focus:outline-none"
    />

    <label for="condition" class="mb-1 block text-sm text-ink-secondary">Condition</label>
    <select
      id="condition"
      formControlName="condition"
      class="mb-4 w-full rounded-lg border border-line-strong px-3 py-2 text-sm focus:border-brand focus:outline-none"
    >
      @for (condition of conditions; track condition[0]) {
        <option [value]="condition[0]">{{ condition[1] }}</option>
      }
    </select>

    <label for="marketPlaceLink" class="mb-1 block text-sm text-ink-secondary">Marketplace link</label>
    <input
      id="marketPlaceLink"
      formControlName="marketPlaceLink"
      type="url"
      placeholder="https://www.tcgplayer.com/..."
      class="mb-4 w-full rounded-lg border border-line-strong px-3 py-2 text-sm placeholder:text-ink-faint focus:border-brand focus:outline-none"
    />

    <!-- Only when adding; an existing item gets more pictures on its detail page. -->
    @if (!itemId) {
      <span class="mb-1 block text-sm text-ink-secondary">Picture</span>
      <div class="relative mb-6">
        <label
          for="picture"
          class="flex cursor-pointer flex-col items-center justify-center rounded-lg border border-dashed border-line-strong py-8 text-sm text-ink-muted hover:border-brand-line"
          (dragover)="$event.preventDefault()"
          (drop)="$event.preventDefault(); pickPicture($event.dataTransfer?.files)"
        >
          @if (picture(); as picture) {
            <span class="font-medium text-ink-secondary">{{ picture.name }}</span>
            <span class="text-xs">Click or drop to replace</span>
          } @else {
            <span aria-hidden="true">↑</span>
            Click to upload or drag and drop
          }
          <input
            #fileInput
            id="picture"
            type="file"
            accept="image/*"
            class="sr-only"
            (change)="pickPicture(fileInput.files); fileInput.value = ''"
          />
        </label>
        @if (picture()) {
          <!-- Outside the label, otherwise the click would also open the file picker. -->
          <button
            type="button"
            aria-label="Remove picture"
            (click)="picture.set(null)"
            class="absolute top-2 right-2 flex size-6 items-center justify-center rounded-full bg-card text-sm text-ink-secondary hover:bg-red-50 hover:text-red-600"
          >
            ×
          </button>
        }
      </div>
    }

    @if (error()) {
      <p class="mb-4 text-sm text-red-600" role="alert">{{ error() }}</p>
    }

    <div class="flex gap-3">
      <a
        [routerLink]="itemId ? ['/items', itemId] : '/'"
        class="flex-1 rounded-lg border border-line-strong py-2 text-center text-sm font-semibold text-ink-secondary hover:bg-card"
      >
        Cancel
      </a>
      <button
        type="submit"
        [disabled]="submitting()"
        class="flex-1 rounded-lg bg-brand py-2 text-sm font-semibold text-white hover:bg-brand-hover disabled:opacity-50"
      >
        Save item
      </button>
    </div>
  </form>
</main>
