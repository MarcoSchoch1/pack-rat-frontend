<main class="flex min-h-screen items-center justify-center bg-base p-4">
  <form [formGroup]="form" (ngSubmit)="submit()"  class="w-full max-w-xs rounded-2xl border border-line bg-surface shadow-card p-7">
    <div class="mb-6 flex flex-col items-center text-center">
      <div
        class="mb-3 flex h-12 w-12 items-center justify-center rounded-xl bg-brand-soft text-2xl text-brand"
        aria-hidden="true"
      >
        +
      </div>
      <h1 class="text-lg font-bold text-ink">Create your collection</h1>
      <p class="text-sm text-ink-muted">Give your collection a name to get started</p>
    </div>

    <label for="name" class="mb-1 block text-sm text-ink-secondary">Collection name</label>
    <input
      id="name"
      formControlName="name"
      type="text"
      placeholder="My One Piece Collection"
      class="mb-6 w-full rounded-lg border border-line-strong px-3 py-2 text-sm placeholder:text-ink-faint focus:border-brand focus:outline-none"
    />

    @if (error()) {
    <p class="mb-4 text-sm text-red-600" role="alert">{{ error() }}</p>
    }

    <button
      type="submit"
      [disabled]="form.invalid || submitting()"
      class="w-full rounded-lg bg-brand py-2 text-sm font-semibold text-white hover:bg-brand-hover disabled:opacity-50"
    >
      Create collection
    </button>
  </form>
</main>
