<main class="flex min-h-screen items-center justify-center bg-slate-50 p-4">
  <form [formGroup]="form" (ngSubmit)="submit()"  class="w-full max-w-xs rounded-2xl border border-slate-200 bg-white p-7">
    <div class="mb-6 flex flex-col items-center text-center">
      <div
        class="mb-3 flex h-12 w-12 items-center justify-center rounded-xl bg-indigo-50 text-2xl text-indigo-600"
        aria-hidden="true"
      >
        +
      </div>
      <h1 class="text-lg font-bold text-slate-900">Create your collection</h1>
      <p class="text-sm text-slate-400">Give your collection a name to get started</p>
    </div>

    <label for="name" class="mb-1 block text-sm text-slate-600">Collection name</label>
    <input
      id="name"
      formControlName="name"
      type="text"
      placeholder="My One Piece Collection"
      class="mb-6 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm placeholder:text-slate-300 focus:border-indigo-500 focus:outline-none"
    />

    @if (error()) {
    <p class="mb-4 text-sm text-red-600" role="alert">{{ error() }}</p>
    }

    <button
      type="submit"
      [disabled]="form.invalid || submitting()"
      class="w-full rounded-lg bg-indigo-600 py-2 text-sm font-semibold text-white hover:bg-indigo-700 disabled:opacity-50"
    >
      Create collection
    </button>
  </form>
</main>
