server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 5m;            # matches spring.servlet.multipart.max-request-size; Nginx default 1m breaks uploads

  location /api/ {
    proxy_pass http://backend:8080;   # no trailing slash: keeps the /api prefix
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html; # Angular routes survive a reload
  }
}
